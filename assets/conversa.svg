<svg xmlns="http://www.w3.org/2000/svg" width="800" height="598" viewBox="0 0 800 598" role="img" aria-label="Conversa com Rafael Nascimento">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.b{animation:in .7s cubic-bezier(.22,1,.36,1) both;}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="799" height="597" rx="6" fill="#ffffff" stroke="#d1d9e0"/>
<path d="M0.5 6.5a6 6 0 0 1 6-6h787a6 6 0 0 1 6 6v57h-799z" fill="#f6f8fa"/>
<line x1="0.5" y1="64" x2="799.5" y2="64" stroke="#d1d9e0"/>
<circle cx="38" cy="32.0" r="18" fill="#ddf4ff" stroke="#d1d9e0"/>
<text x="38" y="37.0" font-size="13" font-weight="600" fill="#0969da" text-anchor="middle">RN</text>
<text x="66" y="30.0" font-size="14" font-weight="600" fill="#1f2328">Rafael Nascimento</text>
<text x="66" y="48.0" font-size="12" fill="#59636e">dev full stack · C# e .NET</text>
<g class="b" style="animation-delay:0.40s"><rect x="20" y="84" width="160" height="42" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text font-size="15" fill="#1f2328"><tspan x="36" y="110">Oi, quem é você?</tspan></text></g><g class="b" style="animation-delay:1.54s"><rect x="364" y="144" width="416" height="42" rx="12" fill="#0969da"/><text font-size="15" fill="#ffffff"><tspan x="380" y="170">Rafael. Dev full stack, com C# e .NET no centro.</tspan></text></g><g class="b" style="animation-delay:2.48s"><rect x="204" y="194" width="576" height="42" rx="12" fill="#0969da"/><text font-size="15" fill="#ffffff"><tspan x="220" y="220">Hoje estou no Umbler Talk, uma plataforma de atendimento multicanal.</tspan></text></g><g class="b" style="animation-delay:3.29s"><rect x="348" y="244" width="432" height="42" rx="12" fill="#0969da"/><text font-size="15" fill="#ffffff"><tspan x="364" y="270">Levo cada feature do modelo de domínio até a tela.</tspan></text></g><g class="b" style="animation-delay:4.09s"><rect x="20" y="304" width="144" height="42" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text font-size="15" fill="#1f2328"><tspan x="36" y="330">E antes disso?</tspan></text></g><g class="b" style="animation-delay:5.26s"><rect x="332" y="364" width="448" height="42" rx="12" fill="#0969da"/><text font-size="15" fill="#ffffff"><tspan x="348" y="390">Anos em ERP integrando pagamento: TEF, PIX e boleto.</tspan></text></g><g class="b" style="animation-delay:6.14s"><rect x="268" y="414" width="512" height="42" rx="12" fill="#0969da"/><text font-size="15" fill="#ffffff"><tspan x="284" y="440">Hoje é DDD, APIs REST, mensageria e a WhatsApp Business API.</tspan></text></g><g class="b" style="animation-delay:6.94s"><rect x="20" y="474" width="184" height="42" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text font-size="15" fill="#1f2328"><tspan x="36" y="500">E fora do trabalho?</tspan></text></g><g class="b" style="animation-delay:8.19s"><rect x="236" y="534" width="544" height="42" rx="12" fill="#0969da"/><text font-size="15" fill="#ffffff"><tspan x="252" y="560">Construo coisas para problemas meus. Algumas estão aqui embaixo.</tspan></text></g>
</svg>