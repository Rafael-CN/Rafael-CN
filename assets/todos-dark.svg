<svg xmlns="http://www.w3.org/2000/svg" width="420" height="140" viewBox="0 0 420 140" role="img" aria-label="Ver todos os repositórios">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.b{animation:in .8s cubic-bezier(.22,1,.36,1) both;}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="6.5" y="6.5" width="407" height="127" rx="6" fill="#151b23" stroke="#3d444d" stroke-dasharray="4 4"/>
<text x="210.0" y="68.0" font-size="15" font-weight="600" fill="#4493f8" text-anchor="middle">Ver todos os repositórios</text>
<text x="210.0" y="90.0" font-size="13" fill="#9198a1" text-anchor="middle">os antigos também estão lá</text>
</svg>