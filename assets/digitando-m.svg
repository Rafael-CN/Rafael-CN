<svg xmlns="http://www.w3.org/2000/svg" width="400" height="60" viewBox="0 0 400 60" role="img" aria-label="digitando">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.b{animation:in .4s cubic-bezier(.22,1,.36,1) both;}
@keyframes p{0%,60%,100%{opacity:.3}30%{opacity:1}} .d{animation:p 1.2s ease-in-out infinite;}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="12" y="8.5" width="72" height="43" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<circle cx="34" cy="30" r="4" fill="#59636e" style="animation-delay:0.00s" class="d"/><circle cx="48" cy="30" r="4" fill="#59636e" style="animation-delay:0.18s" class="d"/><circle cx="62" cy="30" r="4" fill="#59636e" style="animation-delay:0.36s" class="d"/>
</svg>