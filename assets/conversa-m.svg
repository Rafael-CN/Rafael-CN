<svg xmlns="http://www.w3.org/2000/svg" width="400" height="730" viewBox="0 0 400 730" role="img" aria-label="Conversa com Rafael Nascimento">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.b{animation:in .6s cubic-bezier(.22,1,.36,1) both;}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="399" height="729" rx="6" fill="#ffffff" stroke="#d1d9e0"/>
<path d="M0.5 6.5a6 6 0 0 1 6-6h387a6 6 0 0 1 6 6v57h-399z" fill="#f6f8fa"/>
<line x1="0.5" y1="64" x2="399.5" y2="64" stroke="#d1d9e0"/>
<circle cx="30" cy="32.0" r="18" fill="#ddf4ff" stroke="#d1d9e0"/>
<text x="30" y="37.0" font-size="13" font-weight="600" fill="#0969da" text-anchor="middle">RN</text>
<text x="58" y="30.0" font-size="14" font-weight="600" fill="#1f2328">Rafael Nascimento</text>
<text x="58" y="48.0" font-size="12" fill="#59636e">dev full stack · C# e .NET</text>
<g class="b" style="animation-delay:0.40s"><rect x="12" y="84" width="160" height="42" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text font-size="15" fill="#1f2328"><tspan x="28" y="110">Oi, quem é você?</tspan></text></g><g class="b" style="animation-delay:1.42s"><rect x="60" y="144" width="328" height="64" rx="12" fill="#0969da"/><text font-size="15" fill="#ffffff"><tspan x="76" y="170">Rafael. Dev full stack, com C# e .NET</tspan><tspan x="76" y="192">no centro.</tspan></text></g><g class="b" style="animation-delay:2.27s"><rect x="60" y="216" width="328" height="64" rx="12" fill="#0969da"/><text font-size="15" fill="#ffffff"><tspan x="76" y="242">Hoje estou no Umbler Talk, uma</tspan><tspan x="76" y="264">plataforma de atendimento multicanal.</tspan></text></g><g class="b" style="animation-delay:3.01s"><rect x="116" y="288" width="272" height="64" rx="12" fill="#0969da"/><text font-size="15" fill="#ffffff"><tspan x="132" y="314">Levo cada feature do modelo de</tspan><tspan x="132" y="336">domínio até a tela.</tspan></text></g><g class="b" style="animation-delay:3.71s"><rect x="12" y="370" width="144" height="42" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text font-size="15" fill="#1f2328"><tspan x="28" y="396">E antes disso?</tspan></text></g><g class="b" style="animation-delay:4.75s"><rect x="92" y="430" width="296" height="64" rx="12" fill="#0969da"/><text font-size="15" fill="#ffffff"><tspan x="108" y="456">Anos em ERP integrando pagamento:</tspan><tspan x="108" y="478">TEF, PIX e boleto.</tspan></text></g><g class="b" style="animation-delay:5.55s"><rect x="60" y="502" width="328" height="64" rx="12" fill="#0969da"/><text font-size="15" fill="#ffffff"><tspan x="76" y="528">Hoje é DDD, APIs REST, mensageria e a</tspan><tspan x="76" y="550">WhatsApp Business API.</tspan></text></g><g class="b" style="animation-delay:6.25s"><rect x="12" y="584" width="184" height="42" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/><text font-size="15" fill="#1f2328"><tspan x="28" y="610">E fora do trabalho?</tspan></text></g><g class="b" style="animation-delay:7.38s"><rect x="68" y="644" width="320" height="64" rx="12" fill="#0969da"/><text font-size="15" fill="#ffffff"><tspan x="84" y="670">Construo coisas para problemas meus.</tspan><tspan x="84" y="692">Algumas estão aqui embaixo.</tspan></text></g>
</svg>